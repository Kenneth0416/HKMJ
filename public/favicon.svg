<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#065f46"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <!-- Mahjong tile shape -->
  <rect x="25" y="15" width="50" height="70" rx="6" fill="#fef3c7" stroke="#d4a574" stroke-width="2"/>
  <!-- Character 發 (Fa) simplified -->
  <text x="50" y="60" font-family="serif" font-size="32" font-weight="bold" fill="#065f46" text-anchor="middle">發</text>
  <!-- Top decoration -->
  <rect x="30" y="20" width="40" height="3" rx="1" fill="#d4a574"/>
</svg>
